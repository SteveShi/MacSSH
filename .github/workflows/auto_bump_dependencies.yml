name: Auto Bump Dependencies and Release App

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Tuist
        run: |
          brew install mise
          mise install tuist@4.25.0
          mise use -g tuist@4.25.0

      - name: Check Dependencies Versions
        id: check-deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          python3 - << 'EOF'
          import urllib.request, json, re, os, sys

          token = os.environ.get("GITHUB_TOKEN", "")
          headers = {"User-Agent": "MacSSH-CI"}
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def get_latest_semver_tag(repo):
              url = f"https://api.github.com/repos/{repo}/tags?per_page=100"
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req) as resp:
                      tags = json.loads(resp.read().decode())
                  versions = []
                  for t in tags:
                      raw = t.get("name", "").lstrip("v")
                      parts = raw.split(".")
                      if len(parts) == 3 and all(p.isdigit() for p in parts):
                          versions.append((tuple(map(int, parts)), raw))
                  if versions:
                      versions.sort(key=lambda x: x[0], reverse=True)
                      return versions[0][1], versions[0][0]
              except Exception as e:
                  print(f"Error fetching tags for {repo}: {e}", file=sys.stderr)
              return None, None

          def parse_local_version(content, package_name):
              m = re.search(rf"{package_name}\.git\",\s*from:\s*\"([^\"]+)\"", content)
              if m:
                  ver_str = m.group(1)
                  parts = tuple(int(p) for p in ver_str.split(".") if p.isdigit())
                  return ver_str, parts
              return None, None

          with open("Project.swift", "r", encoding="utf-8") as f:
              project_content = f.read()

          local_ssh2, local_ssh2_tuple = parse_local_version(project_content, "SSH2Kit")
          local_macterm, local_macterm_tuple = parse_local_version(project_content, "MactermKit")

          remote_ssh2, remote_ssh2_tuple = get_latest_semver_tag("SteveShi/SSH2Kit")
          remote_macterm, remote_macterm_tuple = get_latest_semver_tag("SteveShi/MactermKit")

          print(f"SSH2Kit: local={local_ssh2} ({local_ssh2_tuple}), remote={remote_ssh2} ({remote_ssh2_tuple})")
          print(f"MactermKit: local={local_macterm} ({local_macterm_tuple}), remote={remote_macterm} ({remote_macterm_tuple})")

          ssh2_needs_update = remote_ssh2_tuple > local_ssh2_tuple if (remote_ssh2_tuple and local_ssh2_tuple) else False
          macterm_needs_update = remote_macterm_tuple > local_macterm_tuple if (remote_macterm_tuple and local_macterm_tuple) else False

          updated = False
          new_content = project_content

          if ssh2_needs_update:
              print(f"Upgrading SSH2Kit: {local_ssh2} -> {remote_ssh2}")
              new_content = re.sub(
                  rf'(SSH2Kit\.git\",\s*from:\s*\")[^\"]+(\")',
                  rf'\g<1>{remote_ssh2}\2',
                  new_content
              )
              updated = True

          if macterm_needs_update:
              print(f"Upgrading MactermKit: {local_macterm} -> {remote_macterm}")
              new_content = re.sub(
                  rf'(MactermKit\.git\",\s*from:\s*\")[^\"]+(\")',
                  rf'\g<1>{remote_macterm}\2',
                  new_content
              )
              updated = True

          if updated:
              with open("Project.swift", "w", encoding="utf-8") as f:
                  f.write(new_content)

          gh_output = os.environ.get("GITHUB_OUTPUT")
          if gh_output:
              with open(gh_output, "a", encoding="utf-8") as f:
                  f.write(f"updates_available={'true' if updated else 'false'}\n")
                  f.write(f"latest_libssh2={remote_ssh2 or local_ssh2}\n")
                  f.write(f"latest_ghostty={remote_macterm or local_macterm}\n")
          EOF

      - name: Set up Xcode
        if: steps.check-deps.outputs.updates_available == 'true'
        uses: SteveShi/setup-xcode@v2
        with:
          xcode-version: 'latest-stable'

      - name: Build and Release App
        if: steps.check-deps.outputs.updates_available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_LIBSSH2_VER: ${{ steps.check-deps.outputs.latest_libssh2 }}
          LATEST_GHOSTTY_VER: ${{ steps.check-deps.outputs.latest_ghostty }}
          SPARKLE_SECRET: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          # Get current versions
          CURRENT_APP_VER=$(grep '"MARKETING_VERSION"' Project.swift | head -n 1 | sed -E 's/.*"MARKETING_VERSION": "([^"]+)".*/\1/')
          CURRENT_BUILD_VER=$(grep '"CURRENT_PROJECT_VERSION"' Project.swift | head -n 1 | sed -E 's/.*"CURRENT_PROJECT_VERSION": "([^"]+)".*/\1/')

          IFS='.' read -r -a APP_PARTS <<< "$CURRENT_APP_VER"
          NEXT_APP_PATCH=$((APP_PARTS[2] + 1))
          NEXT_APP_VER="${APP_PARTS[0]}.${APP_PARTS[1]}.${NEXT_APP_PATCH}"
          NEXT_BUILD_VER=$((APP_PARTS[0] * 10000 + APP_PARTS[1] * 100 + NEXT_APP_PATCH))

          echo "Bumping app version: $CURRENT_APP_VER -> $NEXT_APP_VER"
          echo "Bumping build version: $CURRENT_BUILD_VER -> $NEXT_BUILD_VER"

          # Apply version updates
          sed -i '' "s/\"MARKETING_VERSION\": \"$CURRENT_APP_VER\"/\"MARKETING_VERSION\": \"$NEXT_APP_VER\"/g" Project.swift
          sed -i '' "s/\"CURRENT_PROJECT_VERSION\": \"$CURRENT_BUILD_VER\"/\"CURRENT_PROJECT_VERSION\": \"$NEXT_BUILD_VER\"/g" Project.swift

          # Prepend CHANGELOG.md
          cat <<EOF | sed 's/^          //' > changelog_temp.md
          ## [${NEXT_APP_VER}] - $(date +%Y-%m-%d)

          ### Changed
          - Automatically bumped dependencies to SSH2Kit version ${LATEST_LIBSSH2_VER} and MactermKit version ${LATEST_GHOSTTY_VER}.

          ---

          ### Chinese
          ### 变更
          - 自动更新依赖项 SSH2Kit 至版本 ${LATEST_LIBSSH2_VER}，MactermKit 至版本 ${LATEST_GHOSTTY_VER}。

          ---
          EOF

          # Extract English and Chinese Release Notes
          sed -n '1,/### Chinese/p' changelog_temp.md | grep -v "### Chinese" > release_notes_en.md
          sed -n '/### Chinese/,$p' changelog_temp.md | sed '1d' > release_notes_zh.md

          if [ ! -s release_notes_zh.md ]; then cp release_notes_en.md release_notes_zh.md; fi
          if [ ! -s release_notes_en.md ]; then cp changelog_temp.md release_notes_en.md; fi

          # Generate release_notes.md for Release notes-file body
          cat release_notes_en.md > release_notes.md
          echo -e "\n---\n" >> release_notes.md
          cat release_notes_zh.md >> release_notes.md

          cat changelog_temp.md CHANGELOG.md > changelog_merged.md
          mv changelog_merged.md CHANGELOG.md
          rm changelog_temp.md

          # Regenerate Xcode Project and resolve packages
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          eval "$(mise activate bash 2>/dev/null || true)"
          tuist generate --no-open

          # Build release bundle
          xcodebuild -scheme MacSSH -configuration Release -derivedDataPath BuildData build

          # Locate compiled App and sign it
          APP_PATH=$(find BuildData/Build/Products/Release -name "MacSSH.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "CRITICAL ERROR: MacSSH.app not found!"
            exit 1
          fi

          echo "Applying deep ad-hoc signature..."
          codesign --force --deep -s - "$APP_PATH"

          # Zip executable app bundle
          APP_DIR=$(dirname "$APP_PATH")
          APP_NAME=$(basename "$APP_PATH")
          ZIP_NAME="MacSSH-${NEXT_APP_VER}-arm64.zip"
          DMG_NAME="MacSSH-${NEXT_APP_VER}-arm64.dmg"

          cd "$APP_DIR"
          zip -qy -r "$GITHUB_WORKSPACE/$ZIP_NAME" "$APP_NAME"
          cd -

          # Create DMG
          rm -rf dmg_root
          mkdir -p dmg_root
          cp -R "$APP_PATH" dmg_root/
          hdiutil create -volname "MacSSH" -srcfolder dmg_root -ov -format UDZO "$DMG_NAME"
          rm -rf dmg_root

          # Generate Sparkle Appcast
          SPARKLE_VERSION=$(gh api repos/sparkle-project/Sparkle/releases/latest --jq '.tag_name' | sed 's/^v//')
          curl -fL -H "User-Agent: curl" -o Sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          tar -xf Sparkle.tar.xz

          CLEAN_KEY=$(echo "$SPARKLE_SECRET" | sed 's/EdDSAPrivateKey://' | tr -dc 'A-Za-z0-9+/=')
          
          if [ -z "$CLEAN_KEY" ]; then
            echo "ERROR: SPARKLE_PRIVATE_KEY secret is missing!"
            exit 1
          fi

          mkdir -p deploy
          cp "$ZIP_NAME" deploy/
          cp release_notes_en.md "deploy/release_notes_en.md"
          cp release_notes_zh.md "deploy/release_notes_zh.md"
          cp release_notes_en.md "deploy/release_notes.md"
          
          export DYLD_FRAMEWORK_PATH="$PWD"
          
          echo "$CLEAN_KEY" | ./bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/SteveShi/MacSSH/releases/download/v${NEXT_APP_VER}/" \
            deploy/
          
          if [ -f "deploy/appcast.xml" ]; then
            mv deploy/appcast.xml .
            sed -i.bak '/<description>/d' appcast.xml
            sed -i.bak '/<sparkle:releaseNotesLink>/d' appcast.xml
            
            EN_LINK="https://github.com/SteveShi/MacSSH/releases/download/v${NEXT_APP_VER}/release_notes_en.md"
            ZH_LINK="https://github.com/SteveShi/MacSSH/releases/download/v${NEXT_APP_VER}/release_notes_zh.md"
            
            sed -i.bak "/<enclosure/i\\
            <sparkle:releaseNotesLink xml:lang=\"en\">$EN_LINK</sparkle:releaseNotesLink>" appcast.xml
            sed -i.bak "/<enclosure/i\\
            <sparkle:releaseNotesLink xml:lang=\"zh-Hans\">$ZH_LINK</sparkle:releaseNotesLink>" appcast.xml
            
            rm appcast.xml.bak
          else
            echo "ERROR: generate_appcast failed to produce appcast.xml."
            exit 1
          fi

          # Configure Git and push (Do this BEFORE creating release)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Project.swift CHANGELOG.md
          git commit -m "Auto bump dependencies and version to ${NEXT_APP_VER} [skip ci]"
          git pull --rebase origin main || true
          git push origin main

          # Create Release and upload assets
          gh release create "v${NEXT_APP_VER}" \
            "$ZIP_NAME" \
            "$DMG_NAME" \
            appcast.xml \
            release_notes_en.md \
            release_notes_zh.md \
            --title "v${NEXT_APP_VER}" \
            --notes-file release_notes.md

          # Update Homebrew tap Cask
          SHA256=$(shasum -a 256 "$DMG_NAME" | awk '{print $1}')
          
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/SteveShi/homebrew-tap.git tap-repo
          cd tap-repo
          
          sed -i '' "s/version \".*\"/version \"${NEXT_APP_VER}\"/" Casks/macssh.rb
          sed -i '' -E "s/sha256 (\"[a-f0-9]+\"|:no_check)/sha256 \"$SHA256\"/" Casks/macssh.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/macssh.rb
          git commit -m "Update macssh to ${NEXT_APP_VER}"
          git push
          cd -
